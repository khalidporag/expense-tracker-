<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f4f1" />
    <script>
      // Apply the saved theme before first paint (no flash). Keep in sync with src/lib/theme.js.
      (function () {
        try {
          var p = localStorage.getItem('expense-tracker-theme');
          var dark = p === 'dark' || (p !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var t = dark ? 'dark' : 'light', r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t;
          document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#0b0f17' : '#f4f4f1');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/png" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-192.png" />
    <title>Expenses</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
